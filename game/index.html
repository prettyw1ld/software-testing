<style>
/* Layout: one-screen game. Header bar with score, then level head, then editor (left) + review panel (right); stacks on phones. */
:root {
  --bg: #e9edf3;
  --surface: #f8fafc;
  --line: #cfd6e2;
  --fg: #171b26;
  --muted: #5a6478;
  --accent: #f2d21b;        /* JS yellow, used only for primary actions and markers */
  --accent-ink: #1a1500;
  --good: #1f9d6b;
  --bad: #d4404a;
  --editor: #161a26;
  --editor-2: #1d2232;
  --editor-line: #2a3046;
  --gutter: #59617a;
  --code: #d8deea;
  --syn-kw: #c9a2ff;
  --syn-str: #9fdcae;
  --syn-num: #ffb672;
  --syn-com: #6f7891;
  --syn-fn: #7cc4ff;
  --syn-punc: #9aa3b8;
  --font-display: "Unbounded", "Trebuchet MS", sans-serif;
  --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10131b; --surface: #171b26; --line: #2a3043; --fg: #e8ecf4; --muted: #8e98ad;
    --accent: #f2d21b; --accent-ink: #1a1500; --good: #3ccb8f; --bad: #ff6b74;
    --editor: #0c0f17; --editor-2: #131826; --editor-line: #232a3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10131b; --surface: #171b26; --line: #2a3043; --fg: #e8ecf4; --muted: #8e98ad;
  --accent: #f2d21b; --accent-ink: #1a1500; --good: #3ccb8f; --bad: #ff6b74;
  --editor: #0c0f17; --editor-2: #131826; --editor-line: #232a3d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; background: none; border: 0; color: var(--fg); cursor: pointer; padding: 0; }
.brand-mark { display: inline-grid; place-items: center; width: 30px; height: 30px; background: var(--accent); color: var(--accent-ink); font-size: 13px; border-radius: 4px; }
.bar-stats { margin-left: auto; display: flex; gap: 20px; align-items: center; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; line-height: 1.15; }
.stat small { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.stat b { font-family: var(--font-mono); font-size: 18px; font-weight: 600; }
.steps { display: flex; gap: 3px; }
.steps i { width: 14px; height: 6px; border-radius: 1px; background: var(--line); }
.steps i.done { background: var(--good); }
.steps i.now { background: var(--accent); }

.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; font-weight: 600; font-size: 16px; transition: transform .12s ease, background .12s ease; }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 85%, #fff); }
.btn-ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* intro */
.intro { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 48px; align-items: center; padding-block: 24px; }
.intro h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4.4vw, 52px); line-height: 1.08; letter-spacing: -0.02em; margin: 0 0 20px; text-wrap: balance; }
.intro h1 mark { background: linear-gradient(transparent 62%, var(--accent) 62%); color: inherit; padding: 0 2px; }
.intro .lead { font-size: 19px; color: var(--muted); max-width: 34em; margin: 0 0 28px; }
.rules { list-style: none; padding: 0; margin: 0 0 32px; display: grid; gap: 10px; max-width: 34em; }
.rules li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; align-items: baseline; }
.rules .pts { font-family: var(--font-mono); font-weight: 600; font-size: 15px; text-align: right; }
.pts.plus { color: var(--good); } .pts.minus { color: var(--bad); } .pts.zero { color: var(--muted); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.saved-note { margin-top: 14px; font-size: 14px; color: var(--muted); }

.preview { background: var(--editor); border-radius: 10px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(10, 14, 30, .55); transform: rotate(-1.2deg); min-width: 0; }
.preview .code-body { padding-block: 18px; }
.squiggle { text-decoration: underline wavy var(--bad); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.lint { margin: 0 18px 18px; padding: 10px 12px; border-left: 3px solid var(--bad); background: var(--editor-2); color: var(--code); font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; }
.lint b { color: var(--bad); font-weight: 600; }

/* level */
.lvl-head { display: grid; gap: 6px; margin-bottom: 20px; }
.lvl-head .eyebrow { display: flex; gap: 10px; align-items: center; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.chip { display: inline-block; padding: 3px 9px; border-radius: 3px; background: var(--fg); color: var(--bg); letter-spacing: 0.06em; }
.chip.train { background: var(--accent); color: var(--accent-ink); }
.lvl-head h1 { font-family: var(--font-display); font-size: clamp(24px, 3vw, 34px); font-weight: 700; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.lvl-head p { margin: 0; max-width: 62ch; color: var(--muted); }

.game { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }

.editor { background: var(--editor); border-radius: 10px; overflow: hidden; position: relative; min-width: 0; }
.tabs { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 0 10px 0 0; background: var(--editor-2); border-bottom: 1px solid var(--editor-line); }
.tab { padding: 10px 16px; font-family: var(--font-mono); font-size: 13px; color: var(--code); background: var(--editor); border-right: 1px solid var(--editor-line); display: flex; gap: 8px; align-items: center; }

<script>
(() => {
  // ---------- parse levels ----------
  function parseLevel(src) {
    const lines = src.replace(/^\n/, '').replace(/\s+$/, '').split('\n');
    const lvl = { bugs: {}, order: [], learning: false };
    let section = null, bugKey = null, buf = [];
    const flush = () => {
      if (!section) return;
      const text = buf.join('\n');
      if (section === 'code') lvl.code = text;
      else lvl.bugs[bugKey][section] = text;
      buf = [];
    };
    for (const line of lines) {
      if (!section && line.startsWith('@')) {
        const m = line.match(/^@(\w+)\s*(.*)$/);
        if (m[1] === 'learning') lvl.learning = true; else lvl[m[1]] = m[2];
        continue;
      }
      let m;
      if (line === '--- code') { flush(); section = 'code'; continue; }
      if ((m = line.match(/^--- bug (\d+)$/))) { flush(); bugKey = m[1]; lvl.bugs[bugKey] = {}; lvl.order.push(bugKey); section = 'code'; buf = []; section = 'bugcode'; continue; }
      if (line === '~~~ fix') { flush(); section = 'fix'; continue; }
      if (line === '~~~ why') { flush(); section = 'why'; continue; }
      buf.push(line);
    }
    flush();
    for (const k of lvl.order) { const b = lvl.bugs[k]; b.code = b.bugcode; delete b.bugcode; b.fix = b.fix || ''; }
    return lvl;
  }
  const LEVELS = [...document.querySelectorAll('script[type="text/x-level"]')].map(s => parseLevel(s.textContent));

  // ---------- tokenizer ----------
  const KW = new Set('const let var function return if else for of in while do async await new throw try catch finally switch case default break continue class extends import from export typeof instanceof null undefined true false this delete void yield'.split(' '));
  const TOKEN = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\[\s\S]|[^`\\])*`|'(?:\\.|[^'\\\n])*'|"(?:\\.|[^"\\\n])*")|(\d[\d_]*(?:\.\d+)?)|([A-Za-z_$Ѐ-ӿ][\w$Ѐ-ӿ]*)|(\s+)|(=>|===|!==|==|!=|<=|>=|&&|\|\||\?\?|\?\.|\.\.\.|\+=|-=|\+\+|--|[^\s])/g;
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function highlight(text) {
    let out = '', m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(text))) {
      const t = m[0];
      if (m[5]) { out += esc(t); continue; }
      let cls = 'p';
      if (m[1]) cls = 'c';
      else if (m[2]) cls = 's';
      else if (m[3]) cls = 'n';
      else if (m[4]) cls = KW.has(t) ? 'k' : (/^\s*\(/.test(text.slice(TOKEN.lastIndex)) ? 'f' : '');
      out += `<span class="t ${cls}">${esc(t)}</span>`;
    }
    return out;
  }

  // ---------- render code for a level given fixed set ----------
  function buildCode(lvl, fixed, fresh) {
    const lines = lvl.code.split('\n').filter(line => {
      const m = line.trim().match(/^\{\{(\d+)\}\}$/);
      return !(m && fixed.has(m[1]) && lvl.bugs[m[1]].fix === '');
    });
    const tpl = lines.join('\n');
    let html = '', plain = '', last = 0, m;
    const re = /\{\{(\d+)\}\}/g;
    while ((m = re.exec(tpl))) {
      const before = tpl.slice(last, m.index);
      html += highlight(before); plain += before;
      const k = m[1], bug = lvl.bugs[k];
      if (fixed.has(k)) {
        html += `<span class="fixed${fresh === k ? ' fresh' : ''}">${highlight(bug.fix)}</span>`;
        plain += bug.fix;
      } else {
        html += `<span data-bug="${k}">${highlight(bug.code)}</span>`;
        plain += bug.code;
      }
      last = re.lastIndex;
    }
    html += highlight(tpl.slice(last)); plain += tpl.slice(last);
    return { html, lineCount: plain.split('\n').length };
  }

  // ---------- state ----------
  const STORE = 'clean-js:v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { return {}; } };
  const save = data => { try { localStorage.setItem(STORE, JSON.stringify({ ...load(), ...data })); } catch (e) {} };

  let S = { screen: 'intro' };

  function startGame(fromSaved) {
    const saved = load();
    if (fromSaved && saved.progress) {
      S = { screen: 'level', levelIndex: saved.progress.levelIndex, score: saved.progress.score, max: saved.progress.max };
    } else {
      S = { screen: 'level', levelIndex: 0, score: 0, max: 0 };
    }
    startLevel();
  }

  function startLevel() {
    const lvl = LEVELS[S.levelIndex];
    save({ progress: { levelIndex: S.levelIndex, score: S.score, max: S.max } });
    S.startScore = S.score; S.startMax = S.max;
    S.max += 1000 * lvl.order.length;
    S.fixed = [];
    S.notes = [];
    S.misses = [];
    S.hints = [];
    S.fresh = null;
    S.lastTime = Date.now();
    render();
    window.scrollTo({ top: 0 });
  }

  function nextLevel() {
    if (S.levelIndex + 1 >= LEVELS.length) {
      S.screen = 'results';
      const pct = percent();
      const saved = load();
      save({ progress: null, best: Math.max(saved.best || 0, pct) });
      render();
      window.scrollTo({ top: 0 });
      return;
    }
    S.levelIndex++;
    startLevel();
  }

  const percent = () => S.max > 0 ? Math.round(100 * S.score / S.max) : 0;
  const currentLevel = () => LEVELS[S.levelIndex];
  const remainingKeys = () => currentLevel().order.filter(k => !S.fixed.includes(k));

  // ---------- click handling ----------
  function floatAt(el, text, kind) {
    const ed = document.querySelector('.editor');
    if (!ed || !el) return;
    const r = el.getBoundingClientRect(), er = ed.getBoundingClientRect();
    const f = document.createElement('div');
    f.className = 'float ' + kind;
    f.textContent = text;
    f.style.left = Math.max(8, Math.min(er.width - 90, r.left - er.left)) + 'px';
    f.style.top = (r.top - er.top - 28) + 'px';
    ed.appendChild(f);
    setTimeout(() => f.remove(), 1200);
  }

  function onCodeClick(e) {
    if (S.screen !== 'level' || remainingKeys().length === 0) return;
    const tok = e.target.closest('.t');
    if (!tok) return;
    if (tok.closest('.fixed')) return;
    const bugEl = tok.closest('[data-bug]');
    const lvl = currentLevel();
    if (bugEl) {
      const k = bugEl.dataset.bug;
      const now = Date.now();
      const pts = Math.max(100, 1000 - Math.floor((now - S.lastTime) / 1000));
      S.lastTime = now;
      S.score += pts;
      S.fixed.push(k);
      S.notes.push(k);
      S.fresh = k;
      render();
      const fresh = document.querySelector('.fixed.fresh') || document.querySelector('.code');
      floatAt(fresh.getClientRects().length ? fresh : document.querySelector('.code'), '+' + pts, 'plus');
      return;
    }
    const word = tok.textContent.trim().slice(0, 20);
    if (!word || S.misses.includes(word)) { tok.classList.remove('miss'); void tok.offsetWidth; tok.classList.add('miss'); return; }
    S.misses.push(word);
    const penalty = lvl.learning ? 0 : 200;
    S.score -= penalty;
    tok.classList.remove('miss'); void tok.offsetWidth; tok.classList.add('miss');
    floatAt(tok, penalty ? '−200' : 'мимо', penalty ? 'minus' : 'zero');
    const ed = document.querySelector('.editor');
    ed.classList.remove('shake'); void ed.offsetWidth; ed.classList.add('shake');
    if (S.score < 0) {
      setTimeout(() => { S.screen = 'over'; save({ progress: null }); render(); window.scrollTo({ top: 0 }); }, 650);
      return;
    }
    updateBar();
  }

  function onHint() {
    const k = remainingKeys().find(k => !S.hints.includes(k));
    if (!k) return;
    S.hints.push(k);
    render();
  }

  // ---------- views ----------
  const fmt = n => n.toLocaleString('ru-RU');

  function updateBar() {
    const stats = document.getElementById('stats');
    const inGame = S.screen === 'level';
    stats.hidden = !inGame;
    if (!inGame) return;
    document.getElementById('st-level').textContent = `${S.levelIndex + 1}/${LEVELS.length}`;
    document.getElementById('st-score').textContent = fmt(S.score);
    document.getElementById('st-steps').innerHTML = LEVELS.map((_, i) =>
      `<i class="${i < S.levelIndex ? 'done' : i === S.levelIndex ? 'now' : ''}"></i>`).join('');
  }

  function introView() {
    const saved = load();
    const p = saved.progress;
    const preview = buildCode({ code: 'function calc(a, b) {\n  {{1}} result = a * b;\n  return result;\n}', bugs: { 1: { code: 'var', fix: 'const' } } }, new Set(), null).html
      .replace('<span data-bug="1"><span class="t k">var</span></span>', '<span class="t k squiggle">var</span>');
    return `
      <section class="intro">
        <div>
          <h1>Все хотят работать с&nbsp;<mark>чистым кодом</mark>. Не все умеют его писать.</h1>
          <p class="lead">${LEVELS.length} файлов на JavaScript с типичными ошибками: плохие имена, магические числа, мутации, забытые await. Найди всё, что не пропустил бы внимательный ревьюер.</p>
          <ul class="rules">
            <li><span class="pts plus">+1000</span><span>за найденную проблему, минус по очку за каждую секунду поиска</span></li>
            <li><span class="pts minus">−200</span><span>за клик мимо; повторный клик по тому же слову не штрафуется</span></li>
            <li><span class="pts zero">&lt; 0</span><span>счёт ушёл в минус — игра окончена</span></li>
          </ul>
          <div class="actions">
            <button class="btn btn-primary" id="start" type="button">Начать игру</button>
            ${p ? `<button class="btn btn-ghost" id="continue" type="button">Продолжить с уровня ${p.levelIndex + 1}</button>` : ''}
          </div>
          ${saved.best ? `<p class="saved-note">Твой лучший результат: ${saved.best}%</p>` : ''}
        </div>
        <div class="preview" aria-hidden="true">
          <div class="tabs"><span class="tab"><span class="dot"></span>review.js</span></div>
          <div class="code-body">
            <div class="gutter">1\n2\n3\n4</div>
            <div class="code-scroll"><pre class="code">${preview}</pre></div>
          </div>
          <div class="lint"><b>no-var</b> Unexpected var, use let or const instead.</div>
        </div>
      </section>`;
  }

  function levelView() {
    const lvl = currentLevel();
    const fixedSet = new Set(S.fixed);
    const { html, lineCount } = buildCode(lvl, fixedSet, S.fresh);
    const remaining = remainingKeys();
    const finished = remaining.length === 0;
    const gutter = Array.from({ length: lineCount }, (_, i) => i + 1).join('\n');
    const hintAvailable = remaining.some(k => !S.hints.includes(k));
    const shownHints = S.hints.filter(k => !S.fixed.includes(k));
    const pips = lvl.order.map((_, i) => `<i class="${i < S.fixed.length ? 'found' : ''}"></i>`).join('');
    const notes = S.notes.map(k => {
      const b = lvl.bugs[k];
      const oldTxt = b.code.split('\n').map(l => l.trim()).join(' ');
      const newTxt = b.fix.split('\n').map(l => l.trim()).filter(Boolean).join(' ');
      return `<li><span>${esc(b.why)}</span>
        <div class="diff"><div class="old">${esc(oldTxt)}</div>${newTxt ? `<div class="new">${esc(newTxt)}</div>` : `<div class="new del">удалено</div>`}</div></li>`;
    }).join('');
    const isLast = S.levelIndex === LEVELS.length - 1;
    return `
      <section>
        <div class="lvl-head">
          <div class="eyebrow"><span class="chip ${lvl.learning ? 'train' : ''}">${esc(lvl.topic)}</span>Уровень ${S.levelIndex + 1} из ${LEVELS.length}</div>
          <h1>${esc(lvl.title)}${finished ? ' — пройден' : ''}</h1>
          <p>${esc(lvl.instruction)}</p>
        </div>
        <div class="game">
          <div class="editor">
            <div class="tabs">
              <span class="tab"><span class="dot ${finished ? 'clean' : ''}"></span>${esc(lvl.file)}</span>
              <span class="remain"><span class="label">Осталось найти:</span> <b>${remaining.length}</b> <span class="pips">${pips}</span></span>
              <button class="hint-btn" id="hint" type="button" ${hintAvailable && !finished ? '' : 'disabled'}>${hintAvailable || finished ? 'Подсказка' : 'Подсказок нет'}</button>
            </div>
            <div class="code-body">
              <div class="gutter" aria-hidden="true">${gutter}</div>
              <div class="code-scroll"><pre class="code ${finished ? '' : 'live'}" id="code">${html}</pre></div>
            </div>
            ${shownHints.length ? shownHints.map(k => `<div class="hint-box"><b>Подсказка</b>${esc(lvl.bugs[k].why)}</div>`).join('') : ''}
          </div>
          <aside class="review">
            ${finished ? `<div class="panel done-panel">
              <h2>Файл чистый</h2>
              <p>Все проблемы найдены. Счёт: <b>${fmt(S.score)}</b> из ${fmt(S.max)} возможных.</p>
              <button class="btn btn-primary" id="next" type="button">${isLast ? 'К результатам' : 'Дальше'}</button>
            </div>` : ''}
            <div class="panel">
              <h2>Ревью</h2>
              ${notes ? `<ol class="notes">${notes}</ol>` : `<p class="empty">Здесь появятся объяснения к найденным проблемам.</p>`}
            </div>
          </aside>
        </div>
      </section>`;
  }

  const BOOKS = `
    <h3 class="sub">Что почитать</h3>
    <ul class="books">
      <li><a href="https://github.com/ryanmcdermott/clean-code-javascript" target="_blank" rel="noopener">clean-code-javascript</a> <span>— принципы «Чистого кода», адаптированные для JS</span></li>
      <li><a href="https://eslint.org/docs/latest/rules/" target="_blank" rel="noopener">Правила ESLint</a> <span>— многие ошибки из игры линтер ловит автоматически</span></li>
      <li><span>Роберт Мартин, «Чистый код»</span></li>
      <li><span>Стив Макконнелл, «Совершенный код»</span></li>
    </ul>`;

  function resultsView() {
    const pct = percent();
    let head, line;
    if (pct >= 100) { head = 'Безупречно. Ты прирождённый ревьюер.'; line = 'Покажи игру коллегам: вдруг их пулреквесты станут чище.'; }
    else if (pct > 80) { head = 'Отличный результат!'; line = 'Почти без промахов и быстро. Осталось чуть-чуть до идеала.'; }
    else if (pct > 60) { head = 'Неплохо, но можно лучше.'; line = 'Пройди ещё раз: зная подвохи, ты найдёшь всё быстрее.'; }
    else { head = 'По крайней мере, ты дошёл до конца.'; line = 'Почитай материалы ниже и попробуй снова.'; }
    return `
      <section class="result">
        <h1>${head}</h1>
        <div class="big"><span class="pct">${pct}%</span><span class="of">${fmt(S.score)} из ${fmt(S.max)} возможных очков</span></div>
        <div class="meter"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div>
        <p>${line}</p>
        ${BOOKS}
        <div class="actions"><button class="btn btn-primary" id="again" type="button">Ещё разок</button></div>
      </section>`;
  }

  function overView() {
    return `
      <section class="result">
        <h1>Счёт ушёл в минус. Игра окончена.</h1>
        <p>Это плохая новость. Хорошая — тебе есть куда расти. Ты дошёл до уровня ${S.levelIndex + 1} из ${LEVELS.length}.</p>
        <p>Совет: не кликай наугад. Прочитай код целиком и задай себе вопрос, что бы ты написал в ревью.</p>
        ${BOOKS}
        <div class="actions"><button class="btn btn-primary" id="again" type="button">Ещё раз</button></div>
      </section>`;
  }

  // ---------- render ----------
  const app = document.getElementById('app');
  function render() {
    const views = { intro: introView, level: levelView, results: resultsView, over: overView };
    app.innerHTML = views[S.screen]();
    updateBar();
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
    on('start', () => startGame(false));
    on('continue', () => startGame(true));
    on('again', () => startGame(false));
    on('next', nextLevel);
    on('hint', onHint);
    const code = document.getElementById('code');
    if (code) code.addEventListener('click', onCodeClick);
    S.fresh = null;
  }

  document.getElementById('home').addEventListener('click', () => {
    if (S.screen === 'level') save({ progress: { levelIndex: S.levelIndex, score: S.startScore, max: S.startMax } });
    S = { screen: 'intro' };
    render();
  });

  // keep game state across live updates of the page
  window.claude?.hot?.snapshot?.(() => ({ S }));
  const boot = data => { if (data && data.S && data.S.screen) S = data.S; render(); };
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
